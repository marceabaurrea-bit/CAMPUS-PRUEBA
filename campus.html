<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Campus Virtual - Institución Educativa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<script>
  document.getElementById('campus-form').addEventListener('submit', function(e) {
    e.preventDefault();

    const email = document.getElementById('campus-user').value.trim();
    const pass = document.getElementById('campus-pass').value;
    const msg = document.getElementById('campus-msg');

    // Validación simple
    if (!email || !email.includes('@')) {
      msg.style.color = "#ef4444";
      msg.textContent = "❌ Ingresá un email válido.";
      return;
    }

    if (!pass || pass.length < 6) {
      msg.style.color = "#ef4444";
      msg.textContent = "❌ La contraseña debe tener al menos 6 caracteres.";
      return;
    }

    // Redirigir al campus (panel)
    window.location.assign('panel.html');
  });
</script>

<body>

<header>
  <img src="img/Gemini_Generated_Image_769uab769uab769u.png" alt="Logo" class="logo">
  <h1>Campus Virtual</h1>
</header>

<nav>
  <a href="index.html">Volver al sitio</a>
</nav>

<main>
  <section class="seccion">
    <h2>Ingreso al Campus</h2>
    <p>Ingresá tu email y una contraseña de al menos 6 caracteres.</p>

    <div class="campus-box">
      <form id="campus-form">
        <label for="campus-user">Email</label>
        <input 
          id="campus-user" 
          type="email" 
          placeholder="alumno@mail.com" 
          required
        >

        <label for="campus-pass">Contraseña</label>
        <input 
          id="campus-pass" 
          type="password" 
          placeholder="Mínimo 6 caracteres" 
          required 
          minlength="6"
        >

        <button type="submit">Ingresar</button>

        <p id="campus-msg" class="campus-msg"></p>
      </form>
      <form id="campus-form">
  <input id="campus-user" type="email" required>
  <input id="campus-pass" type="password" required minlength="6">
  <p id="campus-msg" class="campus-msg"></p>
</form>

    </div>
  </section>
</main>
